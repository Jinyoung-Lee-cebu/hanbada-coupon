
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hanbada Coupon</title>
  <style>
    body {{ font-family: sans-serif; background: #f5f5f5; margin:0; padding:20px; }}
    .grid {{ display:flex; flex-wrap: wrap; gap:15px; justify-content:center; }}
    .card {{ width:160px; background:#fff; border-radius:8px; box-shadow:0 0 8px rgba(0,0,0,0.1); overflow:hidden; cursor:pointer; text-align:center; }}
    .card img {{ width:100%; height:auto; }}
    .expired {{ color:red; font-weight:bold; font-size:14px; margin-top:5px; }}
    .modal {{ display:none; position:fixed; z-index:1000; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.7); }}
    .modal-content {{ background:#fff; margin:10% auto; padding:20px; max-width:400px; border-radius:10px; text-align:center; position:relative; }}
    .modal-content img {{ width:100%; border-radius:10px; }}
    .close {{ position:absolute; top:10px; right:15px; font-size:24px; font-weight:bold; cursor:pointer; }}
    .timer {{ margin-top:10px; font-weight:bold; color:green; }}
  </style>
</head>
<body>
  <h1 style="text-align:center;">Hanbada Coupon</h1>
  <div class="grid" id="couponGrid"></div>
  <div class="modal" id="popupModal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <img src="membership.jpg" alt="Membership Card"/>
      <div class="timer" id="countdown"></div>
    </div>
  </div>
  <script>
    const grid = document.getElementById('couponGrid');
    const modal = document.getElementById('popupModal');
    const countdownEl = document.getElementById('countdown');
    let issue = localStorage.getItem('hanbada_coupon_issue_date');
    if (!issue) {{
        issue = Date.now();
        localStorage.setItem('hanbada_coupon_issue_date', issue);
    }}
    const issueDate = new Date(parseInt(issue));
    const expiry = new Date(issueDate);
    expiry.setDate(issueDate.getDate() + 7);
    const now = new Date();
    const isExpired = now > expiry;
    for (let i = 1; i <= 17; i++) {{
      const card = document.createElement('div');
      card.className = 'card';
      const img = document.createElement('img');
      img.src = i + '.png';
      card.appendChild(img);
      if (isExpired) {{
        const msg = document.createElement('div');
        msg.className = 'expired';
        msg.innerText = 'Expired – This coupon is no longer valid';
        card.appendChild(msg);
      }} else {{
        card.onclick = () => openModal();
      }}
      grid.appendChild(card);
    }}
    function openModal() {{
      modal.style.display = 'block';
      updateTimer();
      window.timerId = setInterval(updateTimer, 1000);
    }}
    function closeModal() {{
      modal.style.display = 'none';
      clearInterval(window.timerId);
    }}
    function updateTimer() {{
      const diff = expiry - new Date();
      if (diff <= 0) {{
        countdownEl.innerText = 'Expired – This coupon is no longer valid';
        countdownEl.style.color = 'red';
        clearInterval(window.timerId);
      }} else {{
        const d = Math.floor(diff / (24*3600*1000));
        const h = Math.floor(diff / (3600*1000) % 24);
        const m = Math.floor(diff / (60*1000) % 60);
        const s = Math.floor(diff / 1000 % 60);
        countdownEl.innerText = `Remaining: ${d}d ${h}h ${m}m ${s}s`;
      }}
    }}
    window.onclick = function(e) {{ if (e.target == modal) closeModal(); }};
  </script>
</body>
</html>
